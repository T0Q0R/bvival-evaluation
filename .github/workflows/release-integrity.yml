name: Release integrity (not empirical retraining)

on:
  push:
    branches: [main]
    paths:
      - 'public-code-aggregates-2026-10-05-v2/**'
      - '.github/workflows/release-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payload-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out public code and aggregate files
        # Official checkout v7.0.1; pin the implementation, not a mutable tag.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Report interpreter (standard library only)
        run: python3 -I -B -S -c 'import sys; print(sys.version); assert sys.version_info >= (3, 12)'
      - name: Check 298 files and all four frozen recipe packages
        run: python3 -I -B -S public-code-aggregates-2026-10-05-v2/CHECK_RELEASE.py
      # No dataset download, model fitting, outcome access or dependency install.
      # This is repository integrity checking, not empirical reproduction.
